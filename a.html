<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot 🤖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
        }
        
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 10px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 0;
        }
        
        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 0;
        }
        
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .info-text {
            font-size: 0.85em;
            color: #999;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 Simple AI Chat
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Hallo! 👋 Ich bin ein einfacher AI Chatbot. Schreib eine Frage und ich antworte! 😊
                </div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Schreib eine Nachricht..." 
                autocomplete="off"
            >
            <button id="sendBtn" onclick="sendMessage()">Senden</button>
        </div>
        <div class="info-text">Keine Installation nötig - 100% kostenlos! 🚀</div>
    </div>
    
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const responses = {
            "hallo": "Hallo! Wie geht es dir? 😊",
            "wie heißt du": "Ich bin ein AI Chatbot! Schön dich kennenzulernen! 🤖",
            "wie geht es dir": "Mir geht es gut, danke der Nachfrage! Wie kann ich dir helfen? 😄",
            "wer bist du": "Ich bin ein KI-Assistent, hier um dir zu helfen! 🧠",
            "danke": "Gerne! Immer wieder bereit zu helfen! 💪",
            "tschüss": "Auf Wiedersehen! Bis bald! 👋",
            "bye": "Bye bye! 👋",
            "help": "Du kannst mich alles fragen! Versuche: 'Hallo', 'Wie heißt du', etc. 📚",
            "hilfe": "Du kannst mich alles fragen! Versuche: 'Hallo', 'Wie heißt du', etc. 📚",
            "was ist 2+2": "2+2 = 4! 🧮",
            "witz": "Warum haben Bücher keine Angst? Weil sie Rückhalt haben! 😂",
            "joke": "Why do programmers prefer dark mode? Because light attracts bugs! 🐛",
            "minecraft": "Minecraft ist ein cooles Spiel! 🎮",
            "python": "Python ist eine großartige Programmiersprache! 🐍",
            "javascript": "JavaScript ist perfekt für Web-Entwicklung! 💻",
            "guten morgen": "Guten Morgen! Einen schönen Tag dir! ☀️",
            "gute nacht": "Gute Nacht! Schlaf gut! 😴",
        };
        
        function getResponse(message) {
            const msg = message.toLowerCase().trim();
            
            for (let key in responses) {
                if (msg.includes(key)) {
                    return responses[key];
                }
            }
            
            const randomResponses = [
                "Das ist interessant! 🤔",
                "Erzähl mir mehr! 👂",
                "Sehr interessant! 💭",
                "Das verstehe ich! 😊",
                "Cool! Was noch? 🎉",
                "Das ist eine gute Frage! 🧠",
                "Haha, sehr witzig! 😄",
                "Wow, interessant! ✨"
            ];
            
            return randomResponses[Math.floor(Math.random() * randomResponses.length)];
        }
        
        function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            
            setTimeout(() => {
                const response = getResponse(message);
                addMessage(response, 'bot');
                sendBtn.disabled = false;
                userInput.focus();
            }, 500);
        }
        
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        userInput.focus();
    </script>
</body>
</html>
